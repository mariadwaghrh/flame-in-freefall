<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrustFlame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="styles.css?v=1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/>
        <circle cx="16" cy="16" r="8" class="logo-flame"/><circle cx="16" cy="16" r="3.5" class="logo-core"/>
      </svg>
      <div><div class="brand-name">TrustFlame</div><div class="brand-sub" data-i18n="brand_sub"></div></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="home" data-i18n="tab_home"></button>
      <button role="tab" data-view="story" data-i18n="tab_story"></button>
      <button role="tab" data-view="overview" data-i18n="tab_overview"></button>
      <button role="tab" data-view="investigations" data-i18n="tab_investigations"></button>
      <button role="tab" data-view="moon" data-i18n="tab_moon"></button>
      <button role="tab" data-view="equipment" data-i18n="tab_equipment"></button>
      <button role="tab" data-view="data" data-i18n="tab_data"></button>
      <button role="tab" data-view="ask" data-i18n="tab_ask"></button>
    </nav>
    <button id="lang" class="lang-btn" type="button"></button>
  </header>

  <div class="filters" id="filters">
    <label class="field"><span data-i18n="scenario_label"></span><select id="scenario"></select></label>
    <div class="scenario-note" id="scenario-note"></div>
  </div>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-story" class="view" hidden></section>
    <section id="view-overview" class="view" hidden></section>
    <section id="view-investigations" class="view" hidden></section>
    <section id="view-moon" class="view" hidden></section>
    <section id="view-equipment" class="view" hidden></section>
    <section id="view-data" class="view" hidden></section>
    <section id="view-ask" class="view" hidden></section>
  </main>

  <aside id="drawer" class="drawer" hidden></aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="tooltip" class="tooltip" hidden role="status"></div>
  <footer class="foot" id="foot"></footer>
  <script type="module" src="main.js?v=1"></script>
</body>
</html>
